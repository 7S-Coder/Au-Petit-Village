<!-- “Au petit village” est une entreprise qui confectionne des figurines inspirées de la bande
dessinée Astérix et Obélix.
Elle cible une population jeune entre 30 et 55 ans, nostalgique des aventures des célèbres
Gaulois. -->

<main class="home">
    <section class="hero">
        <h1>Bienvenue au Petit Village</h1>
        <p>Au petit village, nous créons des figurines uniques inspirées de l'univers d'Astérix et Obélix.</p>
    </section>

    <section class="featured-product" *ngIf="product">
        <h2>Produit en vedette</h2>
        <div class="product-card">
            <img [src]="product.imageUrl" [alt]="product.name" class="product-image">
            <div class="product-details">
                <h3 class="product-name">{{ product.name }}</h3>
                <p class="product-description">{{ product.description }}</p>
                <p class="product-price">{{ product.price | currency }}</p>
            </div>
        </div>
        <a href="/products" class="discover-products-button">Découvrir nos produits</a>
    </section>
</main>
